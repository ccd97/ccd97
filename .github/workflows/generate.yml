name: Update Profile Cards & README

on:
  schedule:
    - cron: '0 */12 * * *'
  push:
    paths:
      - 'profile.yaml'
      - 'generate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Generator & Sync Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled 12-hour run: checking for count increase..."
            python3 generate.py --sync-stats --only-if-increased
          else
            echo "Triggered run (${{ github.event_name }}): full generation..."
            python3 generate.py --sync-stats
          fi

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync repo stats & regenerate cards [skip ci]"
          file_pattern: "profile.yaml assets/cards/*.svg README.md"
